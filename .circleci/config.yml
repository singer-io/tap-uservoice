version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-uservoice
            source /usr/local/share/virtualenvs/tap-uservoice/bin/activate
            uv pip install "pip==24.0" "setuptools==70.0.0"
            uv pip install .[dev]
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-uservoice/bin/activate
            pylint tap_uservoice -d missing-docstring,invalid-name,line-too-long,too-many-locals,too-few-public-methods,fixme,stop-iteration-return,too-many-branches,useless-import-alias,no-else-return,logging-format-interpolation,broad-except,attribute-defined-outside-init,too-many-arguments,invalid-all-object,unused-argument,no-member,assignment-from-no-return,len-as-condition,duplicate-code,consider-using-f-string,consider-using-sys-exit,unspecified-encoding,raise-missing-from,missing-timeout,too-many-positional-arguments
      - run:
          name: "Unit Tests"
          command: |
            source /usr/local/share/virtualenvs/tap-uservoice/bin/activate
            uv pip install pytest coverage
            mkdir -p test_output
            coverage run -m pytest tests/unittests --junitxml=test_output/report.xml
            coverage report
            coverage html
      - store_test_results:
          path: test_output
      - store_artifacts:
          path: htmlcov
      # ---------------------------------------------------------------
      # Integration Tests Toggle (USE_TAPTESTER)
      # ---------------------------------------------------------------
      # By default, mocked integration tests run (no external API calls).
      # To run real tap-tester integration tests against the live API,
      # set the environment variable USE_TAPTESTER=true in one of:
      #   - CircleCI project settings → Environment Variables
      #   - The 'circleci-user' context in Organization Settings
      #
      # USE_TAPTESTER=true  → runs tap-tester (requires API credentials)
      # USE_TAPTESTER=false (or unset) → runs mocked integration tests
      # ---------------------------------------------------------------
      - run:
          name: "Integration Tests"
          command: |
            if [ "${USE_TAPTESTER}" = "true" ]; then
              echo "Running tap-tester integration tests..."
              source /usr/local/share/virtualenvs/tap-tester/bin/activate
              uv pip install --upgrade awscli
              aws s3 cp s3://com-stitchdata-dev-deployment-assets/environments/tap-tester/tap_tester_sandbox dev_env.sh
              source dev_env.sh
              run-test --tap=tap-uservoice tests
            else
              echo "Running mocked integration tests..."
              source /usr/local/share/virtualenvs/tap-uservoice/bin/activate
              python -m pytest tests/mock_integration/ -v
            fi
workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
